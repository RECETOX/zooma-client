[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zooma-client"
description = "Python client for the EBI ZOOMA ontology mapping and annotation service."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Helge Hecht" , email = "helge.hecht@recetox.muni.cz"}]
keywords = ["zooma", "ontology", "annotation", "term mapping", "EBI", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
# Runtime deps: requests only, deliberately. Every added dependency is a
# conda build and a version-resolution conflict in downstream tool envs.
dependencies = ["requests>=2.28"]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest",
    "responses",
    "ruff",
]

[dependency-groups]
dev = [
    "pytest",
    "responses",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/RECETOX/zooma-client"
Repository = "https://github.com/RECETOX/zooma-client"
Changelog = "https://github.com/RECETOX/zooma-client/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zooma_client = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "zooma_client.__version__" }

[tool.pytest.ini_options]
# Keep live-API scripts (e.g. smoke_test.py) out of test collection; the
# suite itself must never talk to the network.
testpaths = ["tests"]
